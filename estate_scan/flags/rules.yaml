# Estate Scan flag catalog (build spec section 8).
#
# This file is the COMPLETE catalog from day one. The prototype implements a
# subset (SEC-01, SEM-01, SEM-02, SEM-03, DF-01, DF-02, DF-03, EST-01, ADO-02);
# every other flag is defined here with `implemented: false` so the file
# documents the whole design and nothing is discovered later by surprise.
#
# The field team tunes firing HERE, never in code:
#   - `threshold` values are read by the evaluator; changing one changes firing.
#   - `suppress: true` silences a flag that is otherwise implemented; the run
#     log records that it was suppressed AND whether it would have fired, so a
#     report never hides a flag without saying so (build spec section 8).
#
# All thresholds are PROVISIONAL (build brief section 7). They are not tuned
# against the synthetic fixtures; the run emits distributions for later
# calibration from real engagements.
#
# Fields per flag:
#   severity     critical | warning | informational
#                critical blocks stage 5 for the domain; warning caps stage 3/4
#                or degrades grounding; informational scopes work.
#   confidence   observed (straight from API) | derived (inference such as
#                grouping/lineage) | sampled (partial fetch)
#   facet        dotted facet id the flag scores or caps (build spec section 9)
#   feeds        which front-page finding it assembles into, or null
#   rule         evaluator key in engine.py (only needed when implemented)
#   threshold    named params the evaluator reads
#   scope        estate (one row) | domain (one row per declared domain)
#   implemented  whether the prototype evaluates it
#   suppress     silence an implemented flag but log the suppression

version: 1

flags:

  # -- security -----------------------------------------------------------
  SEC-01:
    severity: critical
    confidence: observed
    facet: data.entitlement_at_source
    feeds: security_finding
    rule: formula_contains_user_context
    threshold: {min_count: 1}
    scope: estate
    implemented: true

  SEC-02:
    severity: warning
    confidence: observed
    facet: governance.preventive
    feeds: security_finding
    rule: permissive_grants
    threshold: {}
    scope: estate
    implemented: false

  # -- semantic -----------------------------------------------------------
  SEM-01:
    severity: warning
    confidence: derived
    facet: semantic.singularity
    feeds: variant_table
    rule: metric_group_variant_count
    threshold: {variant_count_gt: 5}
    scope: domain
    implemented: true

  SEM-02:
    severity: critical
    confidence: derived
    facet: semantic.singularity
    feeds: variant_table
    rule: metric_group_no_dominant
    threshold: {min_usage_variants: 2}
    scope: domain
    implemented: true

  SEM-03:
    severity: warning
    confidence: observed
    facet: semantic.describability
    feeds: variant_table
    rule: description_coverage
    threshold: {min_coverage: 0.40}
    scope: domain
    implemented: true

  SEM-04:
    severity: warning
    confidence: observed
    facet: semantic.exposure_shape
    feeds: null
    rule: datasource_field_count
    threshold: {max_field_count: 300}
    scope: estate
    implemented: false

  # -- data foundation ----------------------------------------------------
  DF-01:
    severity: warning
    confidence: observed
    facet: semantic.exposure_shape
    feeds: variant_table
    rule: embedded_datasource_share
    threshold: {max_embedded_share: 0.60}
    scope: estate
    implemented: true

  DF-02:
    severity: warning
    confidence: derived
    facet: data.provenance
    feeds: retirement_case
    rule: upstream_table_fanout
    threshold: {max_sources_per_table: 10}
    scope: estate
    implemented: true

  DF-03:
    severity: warning
    confidence: derived
    facet: data.provenance
    feeds: retirement_case
    rule: published_on_published_depth
    threshold: {min_depth: 2}
    scope: estate
    implemented: true

  DF-04:
    severity: warning
    confidence: observed
    facet: data.provenance
    feeds: null
    rule: source_without_upstream
    threshold: {}
    scope: estate
    implemented: false

  DF-05:
    severity: critical
    confidence: observed
    facet: data.freshness
    feeds: security_finding
    rule: stale_refresh_recent_view
    threshold: {stale_multiple: 2.0, viewed_within_days: 30}
    scope: estate
    implemented: false

  DF-06:
    severity: warning
    confidence: observed
    facet: data.freshness
    feeds: null
    rule: refresh_failure_rate
    threshold: {max_failure_rate: 0.10}
    scope: estate
    implemented: false

  DF-07:
    severity: warning
    confidence: derived
    facet: data.retained_grain
    feeds: null
    rule: custom_sql_grain_loss
    threshold: {}
    scope: estate
    implemented: false
    suppress: true   # noisy on large estates (build spec section 8)

  # -- governance ---------------------------------------------------------
  GOV-01:
    severity: warning
    confidence: observed
    facet: governance.accountability
    feeds: null
    rule: source_owner_missing
    threshold: {}
    scope: estate
    implemented: false

  GOV-02:
    severity: informational
    confidence: observed
    facet: data.integrity
    feeds: null
    rule: no_data_quality_warnings
    threshold: {}
    scope: estate
    implemented: false

  # -- adoption / lifecycle ----------------------------------------------
  EST-01:
    severity: informational
    confidence: observed
    facet: adoption.reach
    feeds: retirement_case
    rule: zero_view_workbooks
    threshold: {min_count: 1, idle_days: 90}
    scope: estate
    implemented: true

  EST-02:
    severity: warning
    confidence: observed
    facet: semantic.lifecycle
    feeds: null
    rule: business_rule_editors
    threshold: {}
    scope: estate
    implemented: false
    suppress: true   # noisy on large estates (build spec section 8)

  ADO-01:
    severity: warning
    confidence: observed
    facet: adoption.reach
    feeds: null
    rule: active_user_penetration
    threshold: {min_penetration: 0.30}
    scope: estate
    implemented: false

  ADO-02:
    severity: informational
    confidence: observed
    facet: adoption.reach
    feeds: retirement_case
    rule: view_concentration
    threshold: {coverage_fraction: 0.80}
    scope: estate
    implemented: true


# ---------------------------------------------------------------------------
# Facet catalog and scoring bands (build spec section 9).
#
# Each facet scores 1..6. Two derivation paths:
#   - threshold facets: a `measure` compared against ordered `bands`; the facet
#     takes the HIGHEST band whose condition holds.
#   - flag-capped facets: `caps` pull the score down when a flag fires; a single
#     critical flag is a hard ceiling regardless of measure.
#
# Band condition grammar (evaluated by score/facets.py, never eval()'d):
#   "< 0.4"                      measure < 0.4
#   "0.4 - 0.7"                  0.4 <= measure <= 0.7
#   "> 0.7"                      measure > 0.7
#   "> 0.7 and ratified == true" measure clause AND named-input booleans, joined
#                                by " and ". A named input the scan cannot see is
#                                absent and reads false, so scan-only runs cannot
#                                reach bands that need interview evidence.
#
# `scored: true` marks the facets the PROTOTYPE derives -- the semantic and
# adoption facets its flags cover. Every other facet is defined here for the
# complete catalog but left unscored (build brief M6): its dimension reports as
# unscored rather than as clean, and it becomes scorable only by interview.
#
# `gates` lists the stage transitions the facet gates entry into. The dimension
# rollup at a target stage takes the minimum across facets gating THAT stage;
# facets gating lower transitions are reported but do not cap.
#
# All bands are PROVISIONAL and not tuned against fixtures (build brief 7).

facets:

  # -- semantic (scored in the prototype) ---------------------------------
  semantic.singularity:
    dimension: semantic
    evidence: observed
    scored: true
    measure: dominant_variant_share    # share of scoped core metrics with a dominant variant
    bands:
      2: "< 0.4"
      3: "0.4 - 0.7"
      4: "> 0.7 and duplicates_deprecated == true"
      5: "> 0.7 and duplicates_deprecated == true and ratified == true"
      6: "estate_wide == true"
    gates: [5]

  semantic.describability:
    dimension: semantic
    evidence: observed
    scored: true
    measure: description_coverage      # share of fields carrying a description
    bands:
      2: "< 0.4"
      3: "0.4 - 0.7"
      4: "> 0.7"
    gates: [3]

  semantic.exposure_shape:
    dimension: semantic
    evidence: observed
    scored: true
    measure: published_datasource_share  # published / (published + embedded) refs
    bands:
      2: "< 0.4"
      3: "0.4 - 0.7"
      4: "> 0.7"
    gates: [3]

  semantic.consensus:
    dimension: semantic
    evidence: interview      # not observable; the binding facet for many estates
    scored: false
    gates: [5]

  # -- adoption (scored in the prototype) ---------------------------------
  adoption.reach:
    dimension: adoption
    evidence: observed
    scored: true
    measure: content_activation        # share of workbooks with any measured views
    bands:
      2: "< 0.4"
      3: "0.4 - 0.7"
      4: "> 0.7"
    gates: [3]

  adoption.decision_culture:
    dimension: adoption
    evidence: interview
    scored: false
    gates: [4, 5]

  # -- data (defined, unscored in the prototype) --------------------------
  # Kept unscored per build brief M6, but carries the cap block so the
  # flag-capped path is exercised (see tests/test_score.py). Scoring it would
  # cap the data dimension at 2 and tie the binding constraint; the prototype
  # leaves it out of the rollup deliberately.
  data.entitlement_at_source:
    dimension: data
    evidence: observed
    scored: false
    base: 6
    caps:
      - flag: SEC-01
        when: "count > 0"
        max_score: 2
    gates: [5]

  data.provenance:
    dimension: data
    evidence: derived
    scored: false
    gates: [3]

  # -- other dimensions (defined, unscored) -------------------------------
  action.reversibility:
    dimension: action_surface
    evidence: interview
    scored: false
    gates: [5]

  operating.ownership:
    dimension: operating_model
    evidence: interview
    scored: false
    gates: [5]

  value.attribution:
    dimension: value
    evidence: interview
    scored: false
    gates: [4]


# ---------------------------------------------------------------------------
# Governance loop (build spec section 9.3). Governance does NOT roll up by
# minimum. It scores at the highest stage whose loop CLOSES completely: every
# arc active at that stage must reach the tier the stage demands.
#
# Arc activation differs by stage on purpose. Corrective has nothing to stop
# until agents act, so it activates at stage 5. Assurance activates at stage 3.
# `activates_at` is the lowest stage at which the arc must hold; below it the
# arc does not constrain the loop.
#
# All arcs are interview-derived and therefore unscored in the prototype, so
# governance reports as unscored. The closure machinery is built and unit-tested
# (tests/test_score.py) so it is ready when interview capture supplies arc
# scores.
governance_arcs:
  preventive:     {activates_at: 2}
  detective:      {activates_at: 3}
  assurance:      {activates_at: 3}
  corrective:     {activates_at: 5}
  accountability: {activates_at: 2}
