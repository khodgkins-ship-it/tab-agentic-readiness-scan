# Query: published_datasources
# Stage 2. Published data sources with the metadata several flags depend on:
# certification (GOV/semantic), owner (GOV-01), extract presence (freshness),
# upstream tables (DF-02/DF-04 provenance) and downstream workbook count.
#
# Fields are deliberately NOT selected here. Pulling fields inline explodes the
# node count and trips NODE_LIMIT_EXCEEDED on large sources; fields are fetched
# per-source by the datasource_fields query instead (spec 03 §5.1, "field
# extraction is the volume problem").
query published_datasources($first: Int!, $after: String) {
  publishedDatasourcesConnection(first: $first, after: $after) {
    nodes {
      id
      luid
      name
      projectName
      isCertified
      certificationNote
      # ownerEmail on Cloud; the live client falls back to owner { username }
      # and records the substitution in coverage.
      owner { username email: name }
      hasExtracts
      fieldsConnection(first: 1) { totalCount }
      upstreamTables { id name schema fullName }
      # upstreamDatasources feeds published-on-published lineage (DF-03).
      # UNCONFIRMED against the live schema -- report-back item for M7. If the
      # field is absent live, DF-03 degrades to unmeasured rather than failing.
      upstreamDatasources { id luid name }
      downstreamWorkbooksConnection(first: 1) { totalCount }
    }
    pageInfo { hasNextPage endCursor }
    totalCount
  }
}
