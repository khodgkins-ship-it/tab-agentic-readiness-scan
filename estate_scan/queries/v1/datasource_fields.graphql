# Query: datasource_fields
# Stage 4, the volume stage. Fields are scoped to ONE published data source per
# call and the source's fieldsConnection is cursor-paginated.
#
# IMPORTANT schema correctness note (verified against the metadata explorer's
# app/static/schema/api-pitfalls.md, contradicting spec 02 §5 / 03 §5.1):
# field-type connections filter ONLY on id / name / isHidden / text -- there is
# NO datasourceId or datasourceIdWithin argument on calculatedFieldsConnection.
# So we scope by selecting the source via publishedDatasourcesConnection with an
# idWithin filter and paginate its nested fieldsConnection. Resolution is scoped
# to this containing source (spec 03 §7.1: names collide across sources).
#
# fieldsConnection returns the Field interface; __typename distinguishes
# CalculatedField (carries formula) from plain columns.
query datasource_fields($dsId: ID!, $first: Int!, $after: String) {
  publishedDatasourcesConnection(filter: { idWithin: [$dsId] }) {
    nodes {
      id
      luid
      name
      fieldsConnection(first: $first, after: $after) {
        nodes {
          __typename
          id
          name
          description
          isHidden
          ... on CalculatedField {
            formula
            dataType
            role
            # Field-level usage linkage. Usage ranking (spec 03 §7.4) attributes
            # a variant's views to the workbooks whose sheets reference it, then
            # joins to usage_events by workbook. CONFIRMED against live schema
            # (M7 report-back, 2026-09-15): the field on CalculatedField is
            # `sheets: [Sheet]` (vendor/types-and-filters.md:550), NOT
            # `referencedBySheets` (which does not exist and failed the first
            # live scan). The downstream loader/fixture key off the `sheetsUsedIn`
            # alias, so the underlying field name is insulated. Open item: on a
            # very large estate this nested list may itself hit a node limit and
            # need to become a paginated connection.
            sheetsUsedIn: sheets {
              id
              name
              workbook { id luid }
            }
          }
          ... on ColumnField {
            dataType
            role
            # Per-source column projection for DF-08 (root-table column
            # divergence). upstreamColumns are the PHYSICAL columns this field
            # maps onto, each tagged with its root table -- so two published
            # sources built on the same physical table can be compared for
            # column-set / type drift (extends DF-02's table-level fan-out;
            # spec 05 §5). upstreamColumns is valid on ColumnField
            # (vendor/types-and-filters.md); it is placed INSIDE this inline
            # fragment so the vendored query validator attributes it to
            # ColumnField, not to the outer fieldsConnection (the same
            # brace-stripping that insulates `sheetsUsedIn` above). Column.table
            # is the Table interface (id/name only); fullName/luid live on
            # DatabaseTable, hence the inline fragment. Open item: on a very
            # wide source this nested list may itself hit a node limit -- the
            # runner's partial-response subdivision degrades it, but a paginated
            # connection would be the durable fix.
            upstreamColumns {
              name
              remoteType
              table {
                id
                name
                ... on DatabaseTable {
                  luid
                  fullName
                }
              }
            }
          }
        }
        pageInfo { hasNextPage endCursor }
        totalCount
      }
    }
  }
}
