[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "estate_scan"
version = "0.1.0"
description = "Tableau estate scan producing an agentic analytics readiness assessment"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "jinja2>=3.0",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
estate_scan = "estate_scan.cli:main"

[tool.setuptools]
packages = ["estate_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
